[settings]
; ↓ Discord Developer Portal でコピーした Bot のトークンを貼り付けてください
; （トークンは Bot のパスワードです。絶対に他人に見せないでください）
BOT_TOKEN = ここにトークンを貼り付け

; 対象サーバーの名前（Bot が参加しているサーバーがひとつだけなら空欄でもOK）
GUILD_NAME = ともしょうAquarium Group

; サーバーIDが分かる場合はこちらに書くと確実です（空欄なら上の名前で探します）
GUILD_ID =

; 保存先フォルダ（このフォルダの中の downloads に保存されます）
OUTPUT_DIR = downloads

; 動画も一緒に保存したい場合は true にしてください
INCLUDE_VIDEOS = false
